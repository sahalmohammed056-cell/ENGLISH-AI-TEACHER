<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English AI Teacher</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 90vh;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #4a90e2;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 15px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .ai-message {
            background: #e9effd;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .user-message {
            background: #4a90e2;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .input-area {
            padding: 15px;
            background: #fafafa;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 18px;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
            font-size: 1rem;
        }

        input[type="text"]:focus {
            border-color: #4a90e2;
        }

        button {
            background: #4a90e2;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background: #357abd;
        }

        .mic-btn {
            background: #ff4757;
            padding: 12px;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mic-btn:hover {
            background: #e84118;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <div class="avatar">🤖</div>
            <div>English AI Teacher</div>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message ai-message">
                Hello! I am your AI English Teacher. Let's practice English together. How can I help you today?
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type a message or sentence..." onkeypress="handleKeyPress(event)">
            <button class="mic-btn" onclick="startVoice()">🎙️</button>
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');

        // Automatic responses for learning English
        function getAIResponse(input) {
            const text = input.toLowerCase();
            
            if (text.includes('hello') || text.includes('hi')) {
                return "Hello! Great to see you. Tell me, how was your day?";
            } else if (text.includes('how are you')) {
                return "I am doing great, thank you! Ready to practice some English with you. What topic would you like to talk about?";
            } else if (text.includes('grammar') || text.includes('help')) {
                return "Sure! Send me any sentence, and I will check if the grammar is correct.";
            } else if (text.includes('name')) {
                return "I am your AI English Assistant. You can call me Teacher AI!";
            } else if (text.includes('bye')) {
                return "Goodbye! Keep practicing every day. Have a wonderful day!";
            } else {
                return "That sounds interesting! Can you tell me a bit more about that in English?";
            }
        }

        function sendMessage() {
            const text = userInput.value.trim();
            if (text === "") return;

            // User Message
            appendMessage(text, 'user-message');
            userInput.value = "";

            // AI Response Delay
            setTimeout(() => {
                const aiReply = getAIResponse(text);
                appendMessage(aiReply, 'ai-message');
                speakText(aiReply);
            }, 600);
        }

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', className);
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // Voice output (AI speak)
        function speakText(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            }
        }

        // Voice input (Microphone)
        function startVoice() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognition.lang = 'en-US';

                recognition.onstart = function() {
                    userInput.placeholder = "Listening...";
                };

                recognition.onresult = function(event) {
                    const transcript = event.results[0][0].transcript;
                    userInput.value = transcript;
                    userInput.placeholder = "Type a message or sentence...";
                    sendMessage();
                };

                recognition.onerror = function() {
                    userInput.placeholder = "Type a message or sentence...";
                };

                recognition.start();
            } else {
                alert("Voice search is not supported in this browser.");
            }
        }
    </script>

</body>
</html>
